baseURL = "https://littlenopro.github.io/notes/"
languageCode = "vi-vn"
title = "L1ttl3's note"
theme = "hugo-texify3"

# 1. Định nghĩa Author dưới dạng Table (Sửa lỗi Table vs Value)
[author]
  name = "Đặng Minh Tú"

# 2. Các cấu hình hệ thống
enableGitInfo = true
enableRobotsTXT = true
hasCJKLanguage = true

[pagination]
  pagerSize = 5

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[params]
  title = "L1ttl3's note"
  description = "Lộ trình trở thành Solution Architect & Security Expert"
  customCSS = ["css/custom.css"]

  # Cấu hình bài viết
  math = true
  toc = true
  numberedSubtitles = true
  dateFormat = "2 January 2006"
  # 100%, not 105%: the reference site (Giapppp.github.io) resolves to 100%, and
  # every code-block metric is derived from the root em - the theme sets
  # `pre { padding: 1rem }` and `$radius: 0.25rem`, so a 105% root inflated the
  # fence font, padding and corner radius by 5% against the target rendering.
  rootFontSize = "100%"

  footnote = "© 2026 Đặng Minh Tú - Infomation Security UIT"

  # KHÔNG viết author = "..." ở đây nữa để tránh lỗi unmarshal
  [params.author]
    name = "Đặng Minh Tú"
    bio = "Sinh viên An toàn thông tin tại UIT (ATTN2024)"

  [params.sharingbuttons]
    facebook = false
    twitter = false
    email = false
    linkedin = false
    reddit = false
    whatsapp = false
    hackernews = false
    telegram = false

  [params.commentEngine]
    code = ""

  [params.buymeacoffee]
    code = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    codeFences = true
    guessSyntax = true
    # No line-number gutter. The reference layout (Giapppp.github.io, same
    # hugo-texify3 theme) renders fences as a bare <pre class="chroma">, and
    # the gutter otherwise forces a <table class="lntable"> wrapper that the
    # theme's `pre { padding: 1rem }` cannot space correctly, so the numbers
    # sat flush against the block edge.
    lineNos = false
    # Emit Chroma classes instead of hardcoded solarized-dark inline styles.
    # The theme ships the matching gruvbox palette (.chroma) and a .darkmode
    # variant, so light/dark follow the site toggle instead of a dark block
    # on the light gruvbox background.
    noClasses = false
    style = "gruvbox"
